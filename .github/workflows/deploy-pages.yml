name: Deploy Pages (robust)

# Replaces the flaky legacy "Deploy from a branch" (pages-build-deployment).
# Requires repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Builds the site with Jekyll (so *.md compliance pages get permalinks and
# render as HTML) then uploads _site so every path (wc2026/, /delete-account,
# /privacy, /terms, ...) is served.
#
# GitHub's Pages deploy backend intermittently returns "Deployment failed, try
# again later." on the create-deployment call — hits the legacy build AND
# deploy-pages@v4 alike. So we retry the deploy step up to 3 times.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do NOT cancel an in-flight deploy (avoids half-deploys).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # --- Deploy with retry: the create-deployment call is the flaky part ---
      - name: Deploy (attempt 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Backoff before attempt 2
        if: steps.d1.outcome == 'failure'
        run: sleep 25
      - name: Deploy (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Backoff before attempt 3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 60
      - name: Deploy (attempt 3, final)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
