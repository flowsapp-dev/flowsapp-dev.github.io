name: Deploy Pages (robust)

# Replaces the flaky legacy "Deploy from a branch" (pages-build-deployment).
# Requires repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Uploads the whole repo root so every path (wc2026/, compliance pages, ...) is served.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do NOT cancel an in-flight deploy (avoids half-deploys).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
